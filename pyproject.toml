[project]
name = "horizon"
version = "0.1.0"
description = "Daily outside alert & sky event planner — Hacktoberfest 2026, Touch Grass"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Horizon contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "skyfield>=1.48",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
partners = ["pymongo>=4.6", "sentry-sdk>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
horizon = "horizon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["horizon*"]

[tool.setuptools.package-data]
horizon = ["static/*", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A focused, high-signal ruleset. Blind ``except Exception`` (BLE001) is allowed
# on purpose: degrading gracefully when a network partner, Skyfield or storage
# misbehaves is a design goal for a live demo, not an accident.
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "PIE", "RUF"]
ignore = [
    "BLE001", # intentional graceful degradation on partner / IO failures
    "E501",   # line length is handled by `ruff format`
]

[tool.ruff.lint.isort]
known-first-party = ["horizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["horizon"]
omit = ["horizon/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
