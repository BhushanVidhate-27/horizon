name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache the Skyfield ephemeris
        uses: actions/cache@v4
        with:
          path: .cache
          key: skyfield-de421

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (offline unit tests)
        run: pytest --cov=horizon --cov-report=term-missing

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and smoke-test the CLI
        run: |
          pip install .
          python -c "import horizon, horizon.main; print('import ok')"
          python -m horizon.cli --help
