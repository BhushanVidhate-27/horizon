name: Bug report
description: Something in Horizon isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Horizon is designed to work
        with **no API keys**, so please mention which optional partners you have
        enabled.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python -m horizon.cli --city ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Horizon version / commit
      placeholder: "0.1.0 or the commit SHA"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.12, running locally / Render / DigitalOcean"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or API output
      render: shell
