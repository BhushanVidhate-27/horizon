<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon · go outside</title>
  <meta name="description" content="Horizon finds the best time to go outside today and what to look for in the sky." />
  <meta name="theme-color" content="#05070f" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="theme-night">
  <!-- Icon sprite: referenced with <use href="#i-..."> -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M5 9v6h3l4 4V5L8 9H5z"/><path d="M16 9.5a4 4 0 0 1 0 5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></symbol>
    <symbol id="i-partly-cloudy" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><path d="M8 2v2M2 8h2M3.6 3.6 5 5M12.4 3.6 11 5"/><path d="M9 20h8a3.5 3.5 0 0 0 .3-7A4.8 4.8 0 0 0 8 14a3 3 0 0 0 1 6z"/></symbol>
    <symbol id="i-mostly-clear" viewBox="0 0 24 24"><circle cx="10" cy="9" r="3.4"/><path d="M10 2.4v2M3.6 9h2M5 4 6.5 5.5"/><path d="M11 20h7a3 3 0 0 0 .2-6A4.4 4.4 0 0 0 10 15a2.8 2.8 0 0 0 1 5z"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6 8a3.5 3.5 0 0 0 1 7z"/><path d="M9 18.5 8 21M13 18.5 12 21M17 18.5 16 21"/></symbol>
    <symbol id="i-drizzle" viewBox="0 0 24 24"><path d="M7 15h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6 8a3.5 3.5 0 0 0 1 7z"/><path d="M9 19h.01M13 20h.01M17 19h.01"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M7 15h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6 8a3.5 3.5 0 0 0 1 7z"/><path d="M9 19v.01M13 20v.01M17 19v.01M11 21v.01M15 21v.01"/></symbol>
    <symbol id="i-storm" viewBox="0 0 24 24"><path d="M7 15h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6 8a3.5 3.5 0 0 0 1 7z"/><path d="M13 15l-3 4h3l-2 3"/></symbol>
    <symbol id="i-fog" viewBox="0 0 24 24"><path d="M4 9h16M6 13h13M4 17h12"/></symbol>
    <symbol id="i-planet" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3.6" transform="rotate(-20 12 12)"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></symbol>
    <symbol id="i-meteor" viewBox="0 0 24 24"><path d="M3 3l7 7"/><path d="M12 6l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/><path d="M18 12l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15"/><path d="M3 16h8a3 3 0 1 1-3 3"/></symbol>
    <symbol id="i-uv" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></symbol>
    <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M12 4a2 2 0 0 1 2 2v7a4 4 0 1 1-4 0V6a2 2 0 0 1 2-2z"/><path d="M12 9v7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-phone-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M6.5 8.5C7.6 11 9.9 13.3 12.4 14.4l1.6-1.6c.5-.5 1.2-.6 1.8-.3l2.6 1.2c.6.3 1 .9 1 1.6v2.2c0 1-.8 1.8-1.8 1.8A15.6 15.6 0 0 1 5 6.4C5 5.4 5.8 4.6 6.8 4.6h2.2c.7 0 1.3.4 1.6 1l1.2 2.6"/></symbol>
    <symbol id="i-sunrise" viewBox="0 0 24 24"><path d="M4 18h16"/><path d="M12 15V5"/><path d="M8.5 8.5 12 5l3.5 3.5"/><path d="M7 21h10"/></symbol>
    <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M4 18h16"/><path d="M12 5v10"/><path d="M8.5 11.5 12 15l3.5-3.5"/><path d="M7 21h10"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8 10h8M8 14h8M8 18h5"/></symbol>
  </svg>

  <div class="atmosphere" aria-hidden="true">
    <div class="stars"></div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
  </div>

  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>Horizon</div>
      <div class="top-actions">
        <button id="theme-toggle" class="icon-btn" title="Switch to light" aria-label="Toggle dark and light theme">
          <svg class="ic"><use href="#i-sun"/></svg>
        </button>
        <button id="locate" class="icon-btn" title="Use my location" aria-label="Use my location">
          <svg class="ic"><use href="#i-pin"/></svg>
        </button>
        <label class="speak-toggle" title="Spoken alert (ElevenLabs)">
          <input type="checkbox" id="speak" />
          <span class="speak-ui"><svg class="ic"><use href="#i-sound"/></svg></span>
        </label>
      </div>
    </header>

    <form class="search glass-soft" id="search-form" autocomplete="off">
      <svg class="ic search-ic"><use href="#i-search"/></svg>
      <input id="city" type="text" placeholder="Search for a city…" aria-label="City" />
      <button type="submit" id="go" class="go-btn">Get Horizon</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="result" class="result hidden" aria-live="polite">
      <div class="hero">
        <div class="hero-icon" id="hero-icon"><svg class="ic"><use href="#i-sun"/></svg></div>
        <h1 class="hero-place" id="place">—</h1>
        <div class="hero-meta" id="hero-meta"></div>
        <div class="hero-window">
          <span class="hw-start" id="window-start">--:--</span><span class="hw-end" id="window-end">–--:--</span>
        </div>
        <div class="hero-label">best time to go outside</div>
        <div class="hero-cond" id="hero-cond">—</div>
        <div class="hero-score">
          <div class="ring" id="ring"><span id="score-num">--</span></div>
          <div class="score-cap">outside score</div>
        </div>
      </div>

      <section class="card glass" id="hourly-card">
        <div class="card-title">Hourly outlook · tap an hour</div>
        <div class="hourly-scroll" id="hourly"></div>
        <div class="hourly-detail" id="hourly-detail"></div>
      </section>

      <div class="grid" id="grid"></div>

      <section class="card glass" id="alert-card">
        <div class="card-title">Today's alert</div>
        <p class="alert-message" id="message"></p>
        <audio id="audio" class="audio" controls preload="none" hidden></audio>
      </section>

      <section class="putaway" id="putaway">
        <div class="putaway-icon"><svg class="ic"><use href="#i-phone-off"/></svg></div>
        <div class="putaway-body">
          <div class="putaway-label">Put the phone away</div>
          <p class="nudge" id="nudge"></p>
        </div>
      </section>
    </section>

    <section class="card glass calendar" id="calendar-card">
      <div class="cal-head">
        <div class="card-title no-gap">Sky calendar</div>
        <div class="cal-nav">
          <button id="cal-prev" class="cal-btn" aria-label="Previous month">‹</button>
          <button id="cal-next" class="cal-btn" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="cal-month" id="cal-title">—</div>
      <div class="cal-dow">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
        <span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-detail" id="cal-detail">Highlighted dates have something worth looking up for.</div>
    </section>
  </main>

  <footer class="foot">
    <span>Horizon · Hacktoberfest 2026 · Touch Grass</span>
    <span id="foot-info"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
